# Nombre de la aplicación
spring.application.name=timewarp-tcg

# Puerto donde escuchará el servidor (por defecto 8080)
server.port=8080

# Configuración de logs para ver qué pasa en la consola
logging.level.org.springframework=INFO

# Ruta del archivo: creará una carpeta llamada "data" en la raíz de tu proyecto
spring.datasource.url=jdbc:h2:file:./data/timewarpdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate: Crea/Actualiza las tablas automáticamente basándose en tus clases Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola H2: Para que puedas entrar desde el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Esto permite que la consola se vea dentro de un frame (necesario en versiones nuevas)
spring.h2.console.settings.web-allow-others=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true