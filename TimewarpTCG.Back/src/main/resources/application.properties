# 1. Configuración de la aplicación
spring.application.name=timewarp-tcg
server.port=8080
logging.level.org.springframework=INFO

# 2. Conexión a Supabase
# Sustituye la URL de abajo por la tuya exacta y pon tu contraseña donde dice TU_CONTRASEÑA_REAL
spring.datasource.url=jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:6543/postgres?user=postgres.feekgapbpadwxgadsvbf&password=Json@klaus99

# 3. Driver de PostgreSQL
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 4. Comportamiento de Hibernate (Creará las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 5. Desactivamos H2
spring.h2.console.enabled=false
spring.sql.init.mode=never