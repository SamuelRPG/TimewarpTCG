# =====================================================================================================
# Configuracion SIN SECRETOS (se puede subir a git). Por defecto el servidor arranca con una base de datos
# H2 EN MEMORIA: nada que configurar y nada que pueda filtrarse. Los datos se pierden al cerrarlo.
#
# Para usar Supabase (PostgreSQL) NO escribas la contrasena aqui. Define variables de entorno y activa el perfil:
#   SPRING_DATASOURCE_URL       jdbc:postgresql://HOST:6543/postgres
#   SPRING_DATASOURCE_USERNAME  postgres.xxxxxxxx
#   SPRING_DATASOURCE_PASSWORD  (tu contrasena)
#   y arranca con:  -Dspring.profiles.active=supabase     (ver docs/GUIA_ARRANQUE.md)
# =====================================================================================================
spring.application.name=timewarp-tcg
server.port=8080
logging.level.org.springframework=INFO

# --- Base de datos por defecto: H2 en memoria, con las cartas de data.sql ---
spring.datasource.url=jdbc:h2:mem:timewarp;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
# "embedded": data.sql solo se ejecuta contra H2 (nunca contra Supabase/PostgreSQL)
spring.sql.init.mode=embedded
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# --- Seguridad ---
# Clave para firmar los tokens (JWT). Minimo 32 caracteres. Si se deja vacia se genera una al azar en cada arranque
# (los tokens dejan de valer al reiniciar; vale para desarrollo, NO para produccion).
timewarp.security.jwt-secret=${TIMEWARP_JWT_SECRET:}
timewarp.security.token-ttl-minutes=720
# Cuentas antiguas creadas sin contrasena: false = no pueden entrar; true = la primera contrasena que se use se queda como suya
timewarp.security.allow-claim-legacy-accounts=false
# Origenes web permitidos para CORS / WebSocket (separados por comas). Un cliente Unity de escritorio no envia Origin.
# Vacio = solo localhost.
timewarp.cors.allowed-origins=
# --- Limites ---
timewarp.games.max-concurrent=1000
timewarp.games.idle-minutes=30
